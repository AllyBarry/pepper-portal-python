x-pepper-portal: &pepper-portal
  image: pepper-portal-python:latest
  build:
    context: .
    dockerfile: Dockerfile
  # The NAOqi Python SDK (pynaoqi) ships x86-64-only .so files, so the image must
  # be built *and* run as amd64. Native on x86 hosts; emulated (binfmt/Rosetta) on ARM.
  platform: linux/amd64
  working_dir: /home/user
  environment:
    DISPLAY: ${DISPLAY:-}
    # The LLM is a sibling container, reached by service name on the Compose network.
    OLLAMA_BASE_URL: http://ollama:11434
    OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
    # Speech-to-text is a sibling container too. Point this at
    # http://host.docker.internal:8765 to use the host MLX helper instead
    # (./run_local_services.sh), which is faster on Apple Silicon.
    LOCAL_STT_BASE_URL: ${LOCAL_STT_BASE_URL:-http://speech-to-text:8765}
  # host.docker.internal is built in on Docker Desktop but absent on Linux hosts;
  # kept so the host MLX helper stays reachable when LOCAL_STT_BASE_URL points at it.
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./src:/home/user/src
    - /tmp/.X11-unix:/tmp/.X11-unix
  stdin_open: true
  tty: true
  # Comes back on its own after a reboot: Docker's own restart policy plus
  # `docker.service` being enabled (see install/setup_services.sh) means no
  # separate boot-time script is needed.
  restart: unless-stopped

services:
  # Ollama runs natively for the host CPU/GPU — deliberately NOT the amd64 pin the
  # portal needs, since emulated inference is unusably slow.
  ollama:
    image: ollama/ollama:latest
    container_name: pepper_portal_ollama
    volumes:
      - ollama-models:/root/.ollama
    # Published only on loopback: the portal reaches it over the Compose network,
    # not through this mapping.
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    # On a Linux host with NVIDIA drivers + nvidia-container-toolkit, uncomment for
    # GPU inference. Docker Desktop on macOS cannot pass through Metal — CPU only.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # One-off: downloads the chat model into the ollama-models volume. Run it once
  # (and again after changing OLLAMA_MODEL); it exits when the pull completes.
  ollama-pull:
    image: ollama/ollama:latest
    container_name: pepper_portal_ollama_pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
    entrypoint: ["/bin/sh", "-c", "ollama pull \"$$OLLAMA_MODEL\""]
    restart: "no"

  # CPU Whisper, native arch. Metal is unreachable from a container on macOS
  # (see the ollama note above), so this trades GPU speed for not needing a
  # second terminal running ./run_local_services.sh.
  speech-to-text:
    image: pepper-portal-stt:latest
    build:
      context: .
      dockerfile: host_services/Dockerfile.stt
    container_name: pepper_portal_stt
    environment:
      PEPPER_STT_ENGINE: faster
      PEPPER_STT_HOST: 0.0.0.0
      PEPPER_STT_MODEL: ${PEPPER_STT_MODEL:-tiny}
      PEPPER_STT_LANGUAGE: ${PEPPER_STT_LANGUAGE:-}
    volumes:
      # Model weights download once and survive `docker compose down`.
      - whisper-models:/models
    ports:
      - "127.0.0.1:8765:8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8765/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  pepper-portal:
    <<: *pepper-portal
    container_name: pepper_portal
    depends_on:
      ollama:
        condition: service_healthy
      speech-to-text:
        condition: service_healthy
    ports:
      # Host 8080 is commonly taken by SSH tunnels to the cluster (see README),
      # which shadow Docker's mapping on loopback. 8081 avoids the clash.
      - "8081:5000"

  pepper-portal-arm-setup:
    image: tonistiigi/binfmt:latest
    container_name: pepper_portal_arm_setup
    privileged: true
    command:
      - --install
      - all
    restart: "no"

  pepper-portal-arm:
    <<: *pepper-portal
    container_name: pepper_portal_arm
    depends_on:
      pepper-portal-arm-setup:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
      speech-to-text:
        condition: service_healthy
    ports:
      - "8088:5000"

  # Placeholder for the future ROS integration. Gated behind a profile so it
  # never starts as part of the normal `docker compose up -d` flow — only
  # `docker compose --profile ros up -d` touches it. Replace the image/command
  # once the ROS side of this project is decided.
  ros:
    image: ros:humble
    container_name: pepper_portal_ros
    profiles: ["ros"]
    network_mode: host
    restart: unless-stopped
    command: ["bash", "-c", "echo 'ROS service placeholder — configure me in docker-compose.yaml'; sleep infinity"]

volumes:
  ollama-models:
  whisper-models:
