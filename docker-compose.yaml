x-pepper-portal: &pepper-portal
  image: pepper-portal-python:latest
  build:
    context: .
    dockerfile: Dockerfile
  # The NAOqi Python SDK (pynaoqi) ships x86-64-only .so files, so the image must
  # be built *and* run as amd64. Native on x86 hosts; emulated (binfmt/Rosetta) on ARM.
  platform: linux/amd64
  working_dir: /home/user
  environment:
    DISPLAY: ${DISPLAY:-}
    # The LLM is a sibling container, reached by service name on the Compose network.
    OLLAMA_BASE_URL: http://ollama:11434
    OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
    OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-llava:latest}
    OLLAMA_KEEP_ALIVE_SECONDS: ${OLLAMA_KEEP_ALIVE_SECONDS:-0}
    OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-4096}
  # host.docker.internal is built in on Docker Desktop but absent on Linux hosts;
  # the local STT helper is still reached that way.
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./src:/home/user/src
    - /tmp/.X11-unix:/tmp/.X11-unix
  stdin_open: true
  tty: true

services:
  # Ollama runs natively for the host CPU/GPU — deliberately NOT the amd64 pin the
  # portal needs, since emulated inference is unusably slow.
  ollama:
    image: ollama/ollama:latest
    container_name: pepper_portal_ollama
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "0"
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-4096}
    volumes:
      - ollama-models:/root/.ollama
    # Published only on loopback: the portal reaches it over the Compose network,
    # not through this mapping.
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    # On a Linux host with NVIDIA drivers + nvidia-container-toolkit, uncomment for
    # GPU inference. Docker Desktop on macOS cannot pass through Metal — CPU only.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # One-off: downloads the chat model into the ollama-models volume. Run it once
  # (and again after changing OLLAMA_MODEL); it exits when the pull completes.
  ollama-pull:
    image: ollama/ollama:latest
    container_name: pepper_portal_ollama_pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
    entrypoint: ["/bin/sh", "-c", "ollama pull \"$$OLLAMA_MODEL\""]
    restart: "no"

  # One-off: downloads the visual question-answering model into the same volume.
  ollama-vision-pull:
    image: ollama/ollama:latest
    container_name: pepper_portal_ollama_vision_pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-llava:latest}
    entrypoint: ["/bin/sh", "-c", "ollama pull \"$$OLLAMA_VISION_MODEL\""]
    restart: "no"

  pepper-portal:
    <<: *pepper-portal
    container_name: pepper_portal
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      # Host 8080 is commonly taken by SSH tunnels to the cluster (see README),
      # which shadow Docker's mapping on loopback. 8081 avoids the clash.
      - "8081:5000"

  pepper-portal-arm-setup:
    image: tonistiigi/binfmt:latest
    container_name: pepper_portal_arm_setup
    privileged: true
    command:
      - --install
      - all
    restart: "no"

  pepper-portal-arm:
    <<: *pepper-portal
    container_name: pepper_portal_arm
    depends_on:
      pepper-portal-arm-setup:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
    ports:
      - "8088:5000"

volumes:
  ollama-models:
