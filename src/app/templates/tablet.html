<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>RAIL Lab</title>
  <!--
    Pepper's default tablet page. Kept deliberately simple: no buttons, no
    external assets (works with no internet), and plain CSS only -- the
    NAOqi 2.5 tablet runs an old Android WebView (no CSS variables, clamp(),
    or modern JS). Sized for the 1280x800 tablet.
  -->
  <style>
    html, body {
      height: 100%; margin: 0; overflow: hidden;
      font-family: "Roboto", "Helvetica Neue", Arial, sans-serif;
      background: #0b1020;
      color: #f4f6fb;
    }
    body {
      display: -webkit-box; display: -webkit-flex; display: flex;
      -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column;
      -webkit-box-align: center; -webkit-align-items: center; align-items: center;
      -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
      text-align: center;
    }
    .glow {
      position: absolute; left: 50%; top: 42%;
      width: 760px; height: 760px; margin: -380px 0 0 -380px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(64, 140, 255, 0.28) 0%, rgba(64, 140, 255, 0) 62%);
      -webkit-animation: breathe 6s ease-in-out infinite; animation: breathe 6s ease-in-out infinite;
    }
    .content { position: relative; }
    .mark {
      font-size: 168px; font-weight: 800; letter-spacing: 18px; line-height: 1;
      margin: 0 0 0 18px; /* balance the trailing letter-spacing */
    }
    .mark span { color: #4d9bff; }
    .rule {
      width: 120px; height: 6px; border-radius: 3px; margin: 36px auto;
      background: #4d9bff;
    }
    .welcome { font-size: 44px; font-weight: 300; margin: 0; color: #dfe6f5; }
    .footer {
      position: absolute; bottom: 36px; left: 0; right: 0;
      font-size: 22px; color: #6f7c99; letter-spacing: 2px;
    }
    @-webkit-keyframes breathe {
      0%, 100% { -webkit-transform: scale(0.92); opacity: 0.7; }
      50% { -webkit-transform: scale(1.05); opacity: 1; }
    }
    @keyframes breathe {
      0%, 100% { transform: scale(0.92); opacity: 0.7; }
      50% { transform: scale(1.05); opacity: 1; }
    }
  </style>
</head>

<body>
  <div class="glow"></div>
  <div class="content">
    <h1 class="mark">RAIL<span>&nbsp;LAB</span></h1>
    <div class="rule"></div>
    <p class="welcome">Hi, I'm Pepper. Welcome to the lab!</p>
  </div>
  <div class="footer">RAIL LAB &middot; PEPPER</div>
</body>

</html>
